name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.ARUBA_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.ARUBA_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.ARUBA_USER }}@${{ secrets.ARUBA_HOST }} <<EOF
            set -e

            export MONGODB_URI="${{ secrets.MONGODB_URI }}"
            export MAIL_USER="${{ secrets.MAIL_USER }}"
            export MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
            export PRIVATE_KEY="${{ secrets.PRIVATE_KEY }}"
            export PUBLIC_KEY="${{ secrets.PUBLIC_KEY }}"
            export SWAGGER_URL="${{ secrets.SWAGGER_URL }}"

            cd /var/www/backend

            git checkout produzione
            git pull
            npm install

            pm2 describe BLOG || pm2 start ecosystem.config.cjs --env production
            pm2 reload ecosystem.config.cjs --env production
          EOF