http {
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=post:10m rate=5r/m;

    server {
        listen 80;
        server_name swimigo.it www.swimigo.it;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name swimigo.it www.swimigo.it;

        # FRONTEND
        location / {
            root /var/www/swimigo/frontend;
            index index.html;

            try_files $uri $uri/ /index.html;

            limit_req zone=general burst=40;
        }

        # BACKEND API
        location /api/ {
            limit_req zone=general burst=40;

            proxy_pass http://127.0.0.1:3001/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}